services:
  postgres:
    image: postgres:16
    container_name: cloudlaunch-postgres
    environment:
      POSTGRES_USER: cloudlaunch
      POSTGRES_PASSWORD: cloudlaunchpass
      POSTGRES_DB: cloudlaunch
    ports:
      - "5432:5432"
    volumes:
      - cloudlaunch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlaunch -d cloudlaunch"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: cloudlaunch
    environment:
      DATABASE_URL: postgresql+psycopg://cloudlaunch:cloudlaunchpass@postgres:5432/cloudlaunch
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cloudlaunch_postgres_data:
